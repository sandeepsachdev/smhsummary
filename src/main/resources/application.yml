server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: smh-summary

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}

resend:
  api-key: ${RESEND_API_KEY:}
  from: ${EMAIL_FROM:Briefing <onboarding@resend.dev>}
  to: ${EMAIL_TO:}

email:
  # Trim the email to articles published in the last N hours.
  # Matches the web page's max-age slider default; override per deploy.
  max-age-hours: ${EMAIL_MAX_AGE_HOURS:12}

logging:
  level:
    root: INFO
    com.smhsummary: INFO
